<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - Greenie Tea Store</title>
  <link rel="stylesheet" href="../accets/css/cac.css">
</head>
<body>
  <header class="cart-header">
    <h1>Giỏ hàng của bạn</h1>
    <a href="./index.html" class="back-home">← Tiếp tục mua sắm</a>
  </header>

  <main class="cart-container">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
          <th>Tổng</th>
          <th>Xóa</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="product-info">
            <img src="../accets/img/3hinh.jpg" alt="Camomile Tea">
            <span>Camomile Tea</span>
          </td>
          <td>120.000đ</td>
          <td><input type="number" value="1" min="1"></td>
          <td>120.000đ</td>
          <td><button class="remove-btn">✖</button></td>
        </tr>
        <tr>
          <td class="product-info">
            <img src="../accets/img/3hinh (2).jpg" alt="Cinnamon Tea">
            <span>Sweet Cinnamon Tea</span>
          </td>
          <td>150.000đ</td>
          <td><input type="number" value="2" min="1"></td>
          <td>300.000đ</td>
          <td><button class="remove-btn">✖</button></td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary">
      <h2>Tổng đơn hàng</h2>
      <p>Tạm tính: <span>420.000đ</span></p>
      <p>Phí ship: <span>30.000đ</span></p>
      <p class="grand-total">Tổng cộng: <span>450.000đ</span></p>
      <button class="checkout-btn">Thanh toán</button>
    </div>
  </main>
</body>
</html>
