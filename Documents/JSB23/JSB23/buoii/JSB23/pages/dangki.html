<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng kí</title>
  <link rel="stylesheet" href="../accets/css/dangki.css">
</head>
<body style="background-image: url(../accets/img/pexels-sohi-807598\ \(3\).jpg);">
  <div class="form-container">
    <h2 class="pia">Đăng kí</h2>
    <form>
      <label for="fullname">Họ và tên</label>
      <input type="text" id="fullname" placeholder="Họ và tên">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Email">

      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Mật khẩu">

      <label for="confirm">Nhập lại mật khẩu</label>
      <input type="password" id="confirm" placeholder="Nhập lại mật khẩu">

      <button type="submit">Đăng kí</button>

      <p class="switch-text">
        chưa có tài khoản? <a href="../pages/dangnhap.html">Login</a>
      </p>
    </form>
  </div>
</body>
</html>
